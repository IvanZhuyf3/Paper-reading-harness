dynamic_slots = ["human_claim_tree_diff", "selected_claim_id"]
locale = "en"
content = """
T0 — FT-OPT retrieves broadband photothermal spectra without sequential wavelength tuning.
├── M1 — Delay-domain encoding and Fourier recovery establish the measurement principle. [PDF pp.5-8; Fig. 1]
├── M2 — Spectral fidelity, resolution, sensitivity, and spatial resolution establish system performance. [PDF pp.9-11; Fig. 2]
├── M3 — Broadband high-resolution spectra support molecular classification and mixture unmixing. [PDF pp.12-13; Fig. 3]
├── M4 — Sub-second repeated spectroscopy supports dynamic monitoring. [PDF pp.14-15; Fig. 4]
└── M5 — The platform supports aqueous hyperspectral and volumetric chemical imaging. [PDF pp.15-18; Fig. 5]

All lines above are AGENT INTERPRETATION summaries. Exact AUTHOR CLAIM wording and reader-locatable anchors remain attached to T0, M1-M5, and their subclaims in this model.
"""
prompt_id = "EVIDENCE_ATTACH_SELECTED"
