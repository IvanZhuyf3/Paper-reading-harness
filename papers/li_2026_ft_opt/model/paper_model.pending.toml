dynamic_slots = []
locale = "en"
content = """
I1 — AGENT INTERPRETATION: Molecular vibrations provide intrinsic, label-free chemical specificity.
SOURCE ANCHOR: PDF p.3, Introduction, paragraph beginning "Vibrational spectroscopy and imaging, revealing..."

I2 — AGENT INTERPRETATION: MIR photothermal methods require specialized sources and components, while water absorption creates background, attenuation, and depth limitations.
SOURCE ANCHOR: PDF p.3, Introduction, paragraph beginning "Vibrational spectroscopy and imaging, revealing..."

I3 — AGENT INTERPRETATION: SWIR overtone excitation suppresses water absorption and supports aqueous, deeper volumetric imaging.
SOURCE ANCHOR: PDF p.3, Introduction, paragraph beginning "Vibrational spectroscopy and imaging, revealing..."

I4 — AGENT INTERPRETATION: Conventional OPT obtains spectra by sequential pump-wavelength tuning, coupling source bandwidth, resolution, and acquisition time.
SOURCE ANCHOR: PDF p.3, Introduction, paragraph beginning "Although demonstrating outstanding imaging ability,..."

I5 — AGENT INTERPRETATION: Existing time-domain photothermal routes remain proof-of-concept, label-dependent, or slow.
SOURCE ANCHOR: PDF p.4, Introduction, paragraph beginning "Inspired by FTIR and dual-comb spectroscopy,..."

G1 — AGENT INTERPRETATION: The missing capability is rapid, broadband, high-resolution, sensitive, label-free, aqueous-compatible photothermal spectromicroscopy.
SOURCE ANCHOR: PDF p.4, Introduction, paragraph beginning "Inspired by FTIR and dual-comb spectroscopy,..."
"""
prompt_id = "IDEA_FIXED"
prompt_text = "What would you try? Give one concise idea without apparatus detail."

[[transition_packets]]
id = "TP_CLAIMS_START"
target_stage = "claims"
eligible_levels = ["foundation", "core", "advanced"]
reveal_claim_ids = ["T0"]
reveal_evidence_ids = []
source_node_ids = ["T0"]
dynamic_slots = ["human_idea_juxtaposition"]
locale = "en"
content = """
AUTHOR CLAIM: Here, we introduce Fourier-transform overtone photothermal (FT-OPT) spectroscopy and microscopy, a time-domain framework that retrieves photothermal spectra without sequential wavelength tuning. [...] By overcoming the bandwidth-speed trade-off while retaining high spatial resolution, FT-OPT provides a route toward label-free spectral flow cytometry and high-dimensional chemical imaging in aqueous environments.
SOURCE ANCHORS: PDF p.2, Abstract, paragraph beginning "Overtone photothermal (OPT) microscopy is..."; PDF p.4, Introduction, paragraph beginning "To address these challenges, in..."; PDF p.18, Discussion and Conclusion, paragraph beginning "OPT or SWIR photothermal microscopy..."
AGENT INTERPRETATION: FT-OPT combines broadband supercontinuum excitation, interferometric time-domain encoding, Fourier decoding, and thermal-lens readout to separate spectral bandwidth from sequential wavelength-scanning time while retaining sensitive, high-resolution, aqueous-compatible spectroscopy and microscopy.
"""
prompt_id = "CLAIMS_ADD_T0"
prompt_text = "Which major claim must hold under the paper's title claim? Give one."

[[transition_packets]]
id = "TP_EVIDENCE_START"
target_stage = "evidence"
eligible_levels = ["foundation", "core", "advanced"]
