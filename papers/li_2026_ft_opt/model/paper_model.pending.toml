source_anchors = ["PDF p.5, Results/Principle of FT-OPT spectroscopy and microscopy, paragraph beginning \"Molecular anharmonicity causes deviations from...\""]

[[terminology_nodes]]
id = "TERM_PHOTOTHERMAL"
term = "photothermal detection"
aliases = ["OPT", "photothermal microscopy"]
definition = "Detection of absorption through nonradiative heating and the resulting change in the probe beam, commonly mediated by a local refractive-index gradient."
prerequisites = []
related_claim_ids = ["I2", "I3", "I4", "T0"]
source_anchors = ["PDF p.3, Introduction, paragraph beginning \"Vibrational spectroscopy and imaging, revealing...\"", "PDF p.6, Results/Principle of FT-OPT spectroscopy and microscopy, paragraph beginning \"A major advantage of photothermal imaging...\""]

[[terminology_nodes]]
id = "TERM_MIR_SWIR"
term = "MIR and SWIR"
aliases = ["mid-infrared", "short-wave infrared"]
definition = "MIR denotes mid-infrared excitation; SWIR denotes short-wave infrared excitation. The paper uses SWIR overtone absorption to reduce water absorption relative to MIR operation."
prerequisites = ["TERM_VIBRATIONAL_OVERTONE"]
related_claim_ids = ["I2", "I3"]
source_anchors = ["PDF p.3, Introduction, paragraph beginning \"Vibrational spectroscopy and imaging, revealing...\""]

[[terminology_nodes]]
id = "TERM_TIME_DOMAIN"
term = "time-domain excitation"
aliases = ["delay-domain excitation"]
definition = "Encoding spectral information in how the measured signal changes with a controlled temporal delay, rather than by tuning one wavelength after another."
prerequisites = []
related_claim_ids = ["I4", "I5", "G1", "T0"]
source_anchors = ["PDF p.4, Introduction, paragraph beginning \"Inspired by FTIR and dual-comb spectroscopy,...\""]

[[terminology_nodes]]
id = "TERM_INTERFEROGRAM"
term = "interferogram"
aliases = ["delay scan"]
definition = "The measured signal as a function of relative optical delay; oscillatory contributions from different vibrational frequencies are later separated by a Fourier transform."
prerequisites = ["TERM_TIME_DOMAIN"]
related_claim_ids = ["M1", "S1.1"]
source_anchors = ["PDF p.5-6, Results/Principle of FT-OPT spectroscopy and microscopy, paragraphs beginning \"Molecular anharmonicity causes deviations from...\" and \"The second term in Eq....\""]

[[terminology_nodes]]
id = "TERM_FOURIER_TRANSFORM"
term = "Fourier transform"
aliases = ["FFT", "Fourier decoding"]
definition = "A mathematical change of representation that resolves the frequency components encoded in the delay-dependent interferogram into a spectrum."
prerequisites = ["TERM_INTERFEROGRAM"]
related_claim_ids = ["T0", "S1.1"]
source_anchors = ["PDF p.6, Results/Principle of FT-OPT spectroscopy and microscopy, paragraph beginning \"The second term in Eq....\""]

[[terminology_nodes]]
id = "TERM_BANDWIDTH_RESOLUTION"
term = "spectral bandwidth and resolution"
aliases = ["pump spectrum", "delay window"]
definition = "Bandwidth is the span of frequencies recovered; resolution is the separation scale that can be distinguished. In FT-OPT, the pump spectrum sets span while the sampled delay window sets resolution."
