# Source-anchored claim tree (evidence-detail-free)

I1 [background] — AUTHOR CLAIM: Vibrational spectroscopy and imaging reveal intrinsic molecular signatures for label-free, chemically specific detection. [PDF p.3, Introduction, paragraph beginning \"Vibrational spectroscopy and imaging, revealing...\"]
└─ EDGE_I1_I2 / creates_tension → I2: MIR complexity and water absorption limit the established contrast route.
   I2 [limitation] — AUTHOR CLAIM: MIR methods require specialized sources and components, and water absorption causes background and attenuation. [PDF p.3, Introduction, paragraph beginning \"Vibrational spectroscopy and imaging, revealing...\"]
   └─ EDGE_I2_I3 / motivates_significance → I3: the limitations make a SWIR overtone route relevant.
      I3 [background] — AUTHOR CLAIM: SWIR overtone excitation suppresses water absorption and enables deeper aqueous imaging. [PDF p.3, Introduction, paragraph beginning \"Vibrational spectroscopy and imaging, revealing...\"]
      └─ EDGE_I3_I4 / creates_tension → I4: photothermal spectra still require sequential pump tuning.
         I4 [limitation] — AUTHOR CLAIM: Frequency-domain excitation imposes spectral-performance constraints through tunable-SWIR-source limitations. [PDF p.3, Introduction, paragraph beginning \"Although demonstrating outstanding imaging ability,...\"]
         ├─ EDGE_I4_I5 / establishes_context → I5: the tuning constraint motivates time-domain alternatives.
         │  I5 [existing_routes] — AUTHOR CLAIM: Prior time-domain photothermal demonstrations remain proof-of-concept, label-dependent, or slow. [PDF p.4, Introduction, paragraph beginning \"Inspired by FTIR and dual-comb spectroscopy,...\"]
         └─ EDGE_I4_I5_G1 / defines_gap → G1: the tuning trade-off and limited prior routes define the missing capability.
            G1 [gap] — AGENT INTERPRETATION: Rapid, broadband, high-resolution, sensitive, label-free aqueous photothermal spectromicroscopy is missing. [PDF p.4, Introduction, paragraph beginning \"Inspired by FTIR and dual-comb spectroscopy,...\"]
            └─ EDGE_G1_T0 / resolves_gap → T0: the proposed FT-OPT framework responds to that gap.
               T0 [title claim] — AUTHOR CLAIM: FT-OPT retrieves photothermal spectra without sequential wavelength tuning and provides a route to label-free spectral flow cytometry and high-dimensional aqueous chemical imaging. [PDF p.2 Abstract; PDF p.4 Introduction; PDF p.18 Discussion and Conclusion]
               ├─ EDGE_T0_M1 / decomposes → M1: measurement principle.
               │  M1 [major] — AUTHOR CLAIM: Two delayed broadband SWIR pulses encode all pump-addressable vibrational states in an interferogram. [PDF p.5-6, Results/Principle; Fig. 1, PDF p.8]
               │  ├─ EDGE_M1_S11 / decomposes → S1.1: delay scan, interferogram, and Fourier recovery.
               │  │  S1.1 [subclaim] — AUTHOR CLAIM: Scanning relative delay records an interferogram and Fourier transformation yields spectral information. [Eqs. 1-3, PDF p.5-6]
               │  ├─ EDGE_M1_S12 / decomposes → S1.2: bandwidth and acquisition-speed separation.
               │  │  S1.2 [subclaim] — AUTHOR CLAIM: Pump spectrum determines bandwidth while relative-delay scan speed governs acquisition speed. [PDF p.6, Results/Principle]
               │  └─ EDGE_M1_S13 / operationalizes → S1.3: implemented source, interferometer, and lock-in probe readout.
               │     S1.3 [subclaim] — AUTHOR CLAIM: The FT-OPT setup uses broadband SWIR pulses, a controlled delay, square-wave pump modulation, and lock-in probe demodulation. [PDF p.7, Results/Setup; Fig. 1d-e, PDF p.8]
               ├─ EDGE_T0_M2 / decomposes → M2: system characteristics.
               │  M2 [major] — AUTHOR CLAIM: Reference samples evaluate FT-OPT spectral performance. [PDF p.9-10, Results/System characteristics; Fig. 2, PDF p.11]
               │  ├─ EDGE_M2_S21 / decomposes → S2.1: broadband coverage and standard-spectrum agreement.
               │  │  S2.1 [subclaim] — AUTHOR CLAIM: The recovered spectrum spans a broad range and agrees with a standard spectrum. [PDF p.9; Fig. 2a-c, PDF p.11]
               │  ├─ EDGE_M2_S22 / decomposes → S2.2: delay-window resolution.
               │  │  S2.2 [subclaim] — AUTHOR CLAIM: FT-OPT recovers a lifetime-limited linewidth using a finite temporal window. [PDF p.9; Fig. 2d, PDF p.11]
               │  ├─ EDGE_M2_S23 / decomposes → S2.3: concentration sensitivity.
               │  │  S2.3 [subclaim] — AUTHOR CLAIM: A concentration series estimates the system detection limit by a 3-sigma criterion. [PDF p.9; Fig. 2e, PDF p.11]
               │  └─ EDGE_M2_S24 / decomposes → S2.4: lateral and axial spatial resolution.
               │     S2.4 [subclaim] — AUTHOR CLAIM: Lateral and axial resolution are determined from point-spread and volumetric measurements. [PDF p.10; Fig. 2g-j, PDF p.11]
               ├─ EDGE_T0_M3 / decomposes → M3: molecular identification and mixture analysis.
               │  M3 [major] — AUTHOR CLAIM: Supercontinuum coverage accesses multiple overtone modes together with high spectral resolution. [PDF p.12-13, Results/Identification and unmixing; Fig. 3, PDF p.13]
               │  ├─ EDGE_M3_S31 / decomposes → S3.1: classification.
               │  │  S3.1 [subclaim] — AUTHOR CLAIM: Full spectral range gives clear clustering for molecular classification. [PDF p.12; Fig. 3a-d, PDF p.13]
               │  └─ EDGE_M3_S32 / decomposes → S3.2: quantitative unmixing.
               │     S3.2 [subclaim] — AUTHOR CLAIM: Full range and higher resolution reduce mixture-unmixing error. [PDF p.12-13; Fig. 3e-h, PDF p.13]
               ├─ EDGE_T0_M4 / decomposes → M4: dynamic monitoring.
               │  M4 [major] — AUTHOR CLAIM: FT-OPT enables sensitive overtone spectroscopy on a sub-second scale for dynamic monitoring. [PDF p.14-15, Results/Microfluidic monitoring; Fig. 4, PDF p.15]
               │  ├─ EDGE_M4_S41 / decomposes → S4.1: flow-rate relation.
               │  │  S4.1 [subclaim] — AUTHOR CLAIM: Photothermal modulation depth decreases with increasing flow velocity. [PDF p.14; Fig. 4d-f, PDF p.15]
               │  └─ EDGE_M4_S42 / decomposes → S4.2: repeated alternating-sample acquisition.
               │     S4.2 [subclaim] — AUTHOR CLAIM: Repeated water and cyclooctane spectra demonstrate dynamic monitoring and repeatability. [PDF p.14-15; Fig. 4b-c and 4g, PDF p.15]
               └─ EDGE_T0_M5 / decomposes → M5: aqueous chemical imaging.
                  M5 [major] — AUTHOR CLAIM: FT-OPT combines spectroscopy and photothermal imaging for high-dimensional aqueous imaging. [PDF p.15-18, Results/Imaging; Fig. 5, PDF p.16]
                  ├─ EDGE_M5_S51 / decomposes → S5.1: interfacial chemical contrast.
                  │  S5.1 [subclaim] — AUTHOR CLAIM: Distinct component contrast and simultaneous overtone peaks are observed at an interface. [PDF p.17; Fig. 5a, PDF p.16]
                  ├─ EDGE_M5_S52 / decomposes → S5.2: penetration and hyperspectral volume.
                  │  S5.2 [subclaim] — AUTHOR CLAIM: Aqueous penetration and 4D hyperspectral imaging are demonstrated. [PDF p.17; Fig. 5b-g, PDF p.16; Supplementary Figs. S5-S7, PDF p.38-40]
                  └─ EDGE_M5_S53 / operationalizes → S5.3: matrix factorization converts hyperspectral data into component maps.
                     S5.3 [subclaim] — AUTHOR CLAIM: Non-negative matrix factorization separates principal water and organic components in 4D data. [PDF p.17-18; Fig. 5h-j, PDF p.16]

