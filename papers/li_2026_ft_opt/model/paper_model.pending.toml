[[claim_nodes]]
id = "I2"
role = "limitation"
parents = ["I1"]
author_claim = "MIR-based methods require tunable and broadband sources [...] as well as other specialized optical materials and components, which substantially increase system complexity and cost. More critically, the strong absorption of water leads to severe signal background and attenuation."
agent_interpretation = "MIR photothermal microscopy is capable but source complexity and water absorption constrain aqueous and deep-tissue use."
source_anchors = ["PDF p.3, Introduction, paragraph beginning \"Vibrational spectroscopy and imaging, revealing...\""]
reveal_after = "knowledge_start"

[[claim_nodes]]
id = "I3"
role = "background"
parents = ["I2"]
author_claim = "Exciting overtone transitions with a SWIR source dramatically suppresses water absorption, which not only reduces system cost but also enables 3D imaging of biological samples at millimeter depths."
agent_interpretation = "SWIR overtone photothermal microscopy retains photothermal contrast while reducing the water and hardware penalties of MIR excitation."
source_anchors = ["PDF p.3, Introduction, paragraph beginning \"Vibrational spectroscopy and imaging, revealing...\""]
reveal_after = "knowledge_start"

[[claim_nodes]]
id = "I4"
role = "limitation"
parents = ["I3"]
author_claim = "Photothermal detection cannot obtain spectra via a normal spectrometer; instead, spectra are acquired by tuning the pump wavelength. This frequency-domain excitation approach introduces a series of constraints in spectral performance due to the limitations of mainstream tunable SWIR sources."
agent_interpretation = "Conventional OPT ties spectral coverage and resolution to sequential source tuning, so broader or finer spectra cost acquisition time and depend on source capabilities."
source_anchors = ["PDF p.3, Introduction, paragraph beginning \"Although demonstrating outstanding imaging ability,...\""]
reveal_after = "idea_start"

[[claim_nodes]]
id = "I5"
role = "existing_routes"
parents = ["I4"]
author_claim = "Time-domain excitation schemes have recently been explored in photothermal microscopy as a tentative approach to overcome the above trade-offs, but most remain at the proof-of-concept stage. [...] Existing demonstrations require thermosensitive fluorescent labeling and long integration (~10 min per spectrum)."
agent_interpretation = "Prior time-domain photothermal work does not yet deliver a fast, label-free, aqueous-compatible spectromicroscopy platform."
source_anchors = ["PDF p.4, Introduction, paragraph beginning \"Inspired by FTIR and dual-comb spectroscopy,...\""]
reveal_after = "idea_start"

[[claim_nodes]]
