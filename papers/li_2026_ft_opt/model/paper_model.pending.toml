author_claim = "Photothermal detection cannot obtain spectra via a normal spectrometer; instead, spectra are acquired by tuning the pump wavelength. This frequency-domain excitation approach introduces a series of constraints in spectral performance due to the limitations of mainstream tunable SWIR sources."
