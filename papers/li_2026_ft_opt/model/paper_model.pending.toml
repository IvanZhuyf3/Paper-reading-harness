id = "TERM_VIBRATIONAL_OVERTONE"
term = "vibrational overtone"
aliases = ["overtone transition"]
definition = "A transition to a higher vibrational level whose frequency is an integer multiple, often with anharmonic corrections, of a fundamental vibration; it is usually weaker than the fundamental."
prerequisites = []
