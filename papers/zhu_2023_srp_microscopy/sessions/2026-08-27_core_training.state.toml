human_response = "ok，结束rollout"

[[events]]
sequence = 19
prompt_id = "EVIDENCE_M1_THERMOMETRY_VALIDITY"
prompt_text = "针对 M1 的局部温升 claim：为什么 fluorescence thermometer 的 fluorescence change 可以解释为 temperature change？必须先建立哪条 calibration relation？"
stage = "evidence"
selection_policy_version = "1.2"
human_response = "因为很多dye的Quantum yield和温度有负相关，比如rhodamine B，他就有2%/K的fluorescence/temperature 相关。建立这个calibration就能测温度了。"

[[events]]
sequence = 20
prompt_id = "EVIDENCE_M1_THERMOMETRY_CONFOUNDS"
prompt_text = "除了温度，还有哪些因素可能改变 Rhodamine B fluorescence？你会用什么 control 排除它们？"
stage = "evidence"
selection_policy_version = "1.2"
human_response = "激光会bleach dye，所以需要掌握实验的时间尺度，并提供只有bleach没有thermal的control"

[[events]]
sequence = 21
prompt_id = "EVIDENCE_M1_BLEACH_ONLY_CONTROL_IMPLEMENTATION"
prompt_text = "这个 only-bleach/no-thermal control 里，你会改变哪个实验变量来关闭 thermal generation，同时让 dye 的 optical exposure 尽量保持一致？"
stage = "evidence"
selection_policy_version = "1.2"
human_response = "把SRS调到off resonance，这是2pf可以很接近，但没有SRS"

[[events]]
sequence = 22
prompt_id = "EVIDENCE_M2_MATCHED_SENSITIVITY_COMPARISON"
prompt_text = "如果要证明 SRP 相比 SRS 更灵敏，这个 comparison 中哪些 acquisition variables 必须保持一致，最后比较哪个 sensitivity metric？"
stage = "evidence"
selection_policy_version = "1.2"
human_response = "LoD是最重要的。同时比较小beads 上的performance。参数主要是average power和dwell time"

[[events]]
sequence = 23
prompt_id = "EVIDENCE_M2_RESOLUTION_BEAD_DECONVOLUTION"
prompt_text = "在 single-bead FWHM measurement 中，有限 bead size 要怎样从 measured spatial width 中 deconvolve？"
stage = "evidence"
selection_policy_version = "1.2"
human_response = "一般就FWHM_image^2 = FWHM_PSF^2+FWHM_bead^2，简化算法。FWHM_bead = bead size"

[[events]]
sequence = 24
prompt_id = "EVIDENCE_M3_APPLICATION_PERFORMANCE_LINK"
prompt_text = "在 application figure 中，怎样设计 comparison，才能让它支持“性能提升”而不只是“这个样品可以成像”？"
stage = "evidence"
selection_policy_version = "1.2"
