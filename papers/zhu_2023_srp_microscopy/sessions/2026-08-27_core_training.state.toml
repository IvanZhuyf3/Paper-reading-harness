[[events]]
sequence = 25
prompt_id = "EVIDENCE_M3_FEATURE_RECOGNITION_VALIDITY"
prompt_text = "feature recognition 容易变成主观判断；你会怎样把它 operationalize，或者用什么 blind/control 让比较可复现？"
stage = "evidence"
selection_policy_version = "1.2"
human_response = "如果真的要仔细做，就需要加重复加control加negative control，比如看到cholesterol domain就得做cholesterol depletion。但仪器原理性文章一般不做这么细，喧宾夺主。一般需要细做的，是feature recognization看到了很重要的feature，别的方法看不到，有重大意义的。这种就不需要做comparison，"

[[events]]
sequence = 26
prompt_id = "EVIDENCE_M3_CLARIFY_NO_COMPARISON"
