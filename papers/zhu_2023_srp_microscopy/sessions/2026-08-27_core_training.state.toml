stage = "idea"
selection_policy_version = "1.1"
human_response = "Ended the IDEA rollout. Clarified that the gate should require only enough challenge or clarification to prevent an uncheckable proposal, not exhaustive deliberation."

[[events]]
sequence = 7
prompt_id = "CLAIMS_ADD_T0"
prompt_text = "要让这个 title claim 成立，你首先会在它下面放哪一条 major claim？"
stage = "claims"
selection_policy_version = "1.1"
human_response = "First prove that the SRS thermal effect exists and that its magnitude reaches a measurable regime."

[[events]]
sequence = 8
prompt_id = "CLAIMS_EXPAND_H-C1.1"
prompt_text = "先展开 H-C1.1：你要把“SRS 热效应存在”写成怎样一条可验证的因果 claim？"
stage = "claims"
selection_policy_version = "1.1"
human_response = "存在性，首先可以用energy diagram说明，final state是excited state，这就不像CARS。然后可以做一些simulation，从已有的数据出发，first principle算出来能产生多少热，能积累多少温度。最后可以做一个thermometer验证，比如做一个微型热电偶，1μm那么大，就测focus温度"

[[events]]
sequence = 9
prompt_id = "CLAIMS_ADD_T0_2"
prompt_text = "回到 T0：你下一条要添加的 major claim 是什么？"
stage = "claims"
selection_policy_version = "1.1"
human_response = "第二个major claim是按照这个原理真的能打出来一个显微镜。这里需要subclaim包括：设备架构，信号特征，信号处理方法"

[[events]]
sequence = 10
prompt_id = "CLAIMS_EXPAND_H-C2.1_ARCHITECTURE"
prompt_text = "先展开 H-C2.1：设备架构必须包含哪些功能模块及其关系，才能把这个原理实现成显微镜？"
stage = "claims"
selection_policy_version = "1.2"
human_response = "核心应该是把吸收测量（SRS）转化成散射测量（PT），所以收光侧需要降低NA"

[[events]]
sequence = 11
prompt_id = "CLAIMS_ADD_T0_3"
prompt_text = "回到 T0：还需要添加哪一条 major claim？"
stage = "claims"
selection_policy_version = "1.2"
human_response = "H-C3 显微镜可以达成很好的性能。可能可以做的方向包括：灵敏度（低浓度，测LoD；小particle，测比如50nm plastic beads），分辨率（小beads），spectral fidelity （随便什么样品，比较SRP和Raman），penetration depth （如果有进步的话），speed"

[[events]]
sequence = 12
prompt_id = "CLAIMS_EXPAND_H-C3.1_LOD"
prompt_text = "先展开 H-C3.1 的低浓度灵敏度：你会怎样定义并计算 LoD？"
stage = "claims"
selection_policy_version = "1.2"
human_response = "3σ/k，σ是baseline STD，k是calibration curve的slope。"

[[events]]
sequence = 13
prompt_id = "CLAIMS_EXPAND_H-C3.2_RESOLUTION"
prompt_text = "先展开 H-C3.2：你会怎样用 small-bead measurement 定义并估计显微镜的空间分辨率？"
stage = "claims"
selection_policy_version = "1.2"
human_response = "两个思路：1，测很稀疏的beads，找单个bead的spatial profile，测FWHM，在deconvolute bead shape。2，测密一些的beads，测Fourier ring correlation。实践上就一把测，稀疏就1，密了就2。然后务必oversample on space"

[[events]]
sequence = 14
prompt_id = "CLAIMS_EXPAND_H-C3.3_SPECTRAL_FIDELITY"
prompt_text = "先展开 H-C3.3：你会怎样定义并量化 SRP 相对于参考 Raman 测量的 spectral fidelity？"
stage = "claims"
selection_policy_version = "1.2"
human_response = "测量相同样品，normalize到一起，比较spectrum相似度。一般来说相似度高的就不用讲了，相似度低了就只能讨论下1，什么原理导致不一样；2，余下的这个新spectrum会不会影响spectrum interpretation"

[[events]]
sequence = 15
prompt_id = "CLAIMS_CLARIFY_H-C3.3_SIMILARITY_METRIC"
prompt_text = "这里的 spectrum similarity，你会用哪个 quantitative metric 来定义？"
stage = "claims"
selection_policy_version = "1.2"
human_response = "向量归一化求点积应该就可以。完全相同是1。"

[[events]]
sequence = 16
prompt_id = "CLAIMS_EXPAND_H-C3.5_SPEED"
prompt_text = "先展开 H-C3.5：你会用什么 operational metric 定义 imaging speed，并要求哪些 acquisition conditions 保持一致？"
stage = "claims"
selection_policy_version = "1.2"
human_response = "speed其实不需要严格characterize，一般就测到动的样品在动，标个frame rate就完了。这个一般会放在application那里一起说。"

[[events]]
sequence = 17
prompt_id = "CLAIMS_FINISH_OR_ADD"
prompt_text = "这样调整后，你还要添加别的 major claim，还是结束 CLAIMS rollout？"
stage = "claims"
selection_policy_version = "1.2"
human_response = "接下来需要有一些application。一般一个侧重仪器理论的论文，application会选择全面覆盖各种样品类型和各种信号区间。样品尺度从小到大，virus，cell，tissue；Raman window覆盖C-H，C-D，amide1 就行了。如果是性能提升很大的，就加一些能体现性能提升的应用。这个claim虽然重要，但具体选什么可能不那么重要，上面几个参数排列组合出几个图就行了。"

[[events]]
sequence = 18
prompt_id = "CLAIMS_FINISH"
