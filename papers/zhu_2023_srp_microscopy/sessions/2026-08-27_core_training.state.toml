[[events]]
sequence = 1
prompt_id = "K1"
prompt_text = "在 stimulated Raman scattering（SRS）中，pump 与 Stokes 两束光满足 Raman resonance 时，样品和两束光分别发生什么变化？实验上通常检测的“信号”是什么？"
stage = "knowledge"
selection_policy_version = "1.1"
human_response = "SRL and SRG; normally detect the optical-intensity changes from these processes."

[[events]]
sequence = 2
prompt_id = "K2"
prompt_text = "如果 SRS 信号只是叠加在强 pump 或 Stokes 光束上的一个很小的相对光强变化，最低可检测浓度主要受什么约束？为什么不能简单地无限增加入射光功率来改善它？"
stage = "knowledge"
selection_policy_version = "1.1"
human_response = "Limited modulation depth and shot-noise limit; excessive optical power causes photodamage."

[[events]]
sequence = 3
prompt_id = "IDEA_FIXED"
prompt_text = "在这个问题状态下，你会尝试什么路线？"
stage = "idea"
selection_policy_version = "1.1"
human_response = "Convert the measurement modality and use a more sensitive modality, for example PT."

[[events]]
sequence = 4
prompt_id = "IDEA_CLARIFY_H-I1"
prompt_text = "在你的 PT 路线中，SRS 事件产生的哪个中间物理量携带 Raman-specific information，而 PT readout 具体测量这个量的什么变化？"
stage = "idea"
selection_policy_version = "1.1"
human_response = "SRS is a real transition that produces heat; PT measures heat to temperature to refractive-index change."

[[events]]
sequence = 5
prompt_id = "IDEA_CLARIFY_H-I2_FOLDING"
prompt_text = "我先确认结构：你说的“从 rep rate 反射回来”，是否指脉冲列频谱中的 `f_rep − f_m` 分量在 `f_m = f_rep/2` 时与 `f_m` 重合，因此被同一个 lock-in channel 相干读出？"
stage = "idea"
selection_policy_version = "1.1"
human_response = "Confirmed that f_rep - f_m coincides with f_m at half the repetition rate and is coherently read by the same lock-in channel."

[[events]]
sequence = 6
prompt_id = "IDEA_FINISH"
